name: CI

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'
          cache-provider: basic

      - name: Wrapper and dependency state
        run: |
          ./gradlew --version
          cp gradle.lockfile /tmp/gradle.lockfile
          ./gradlew --no-daemon dependencies --write-locks
          diff -u /tmp/gradle.lockfile gradle.lockfile
          git diff --exit-code -- gradle.lockfile

      - name: Format, test, and build distribution
        run: ./gradlew --no-daemon formatCheck test installDist

      - name: Build pinned strictjava
        env:
          STRICTJAVA_REF: __STRICTJAVA_REF__
        run: |
          git clone --filter=blob:none https://github.com/ilvar/strictjava "$RUNNER_TEMP/strictjava"
          git -C "$RUNNER_TEMP/strictjava" checkout "$STRICTJAVA_REF"
          (
            cd "$RUNNER_TEMP/strictjava"
            ./scripts/build.sh >/dev/null
            gradle --no-daemon prepareAnalyzers
          )
          echo "STRICTJAVA_JAR=$RUNNER_TEMP/strictjava/build/strictjava.jar" >> "$GITHUB_ENV"

      - name: strictjava
        run: ./scripts/strictjava.sh check --classpath "$(./gradlew -q strictjavaClasspath)" .

      - name: Docker image
        run: |
          docker build --target from-artifact --tag __PROJECT__:ci .
          docker run --rm __PROJECT__:ci | grep -Fqx 'Hello from __PROJECT__.'
